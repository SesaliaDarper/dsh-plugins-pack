<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="400" viewBox="0 0 1280 400" role="img" aria-label="dsh-plugins-pack — 五个 DeepSeek Harness 插件">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b0a18"/>
      <stop offset=".52" stop-color="#171233"/>
      <stop offset="1" stop-color="#08131e"/>
    </linearGradient>
    <linearGradient id="iris" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#86E3F0"/>
      <stop offset=".46" stop-color="#8B7BEE"/>
      <stop offset="1" stop-color="#E4B8F0"/>
    </linearGradient>
    <linearGradient id="pill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".10"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity=".04"/>
    </linearGradient>
    <radialGradient id="glowA" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#6C5CE7" stop-opacity=".55"/>
      <stop offset="1" stop-color="#6C5CE7" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#86E3F0" stop-opacity=".35"/>
      <stop offset="1" stop-color="#86E3F0" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowC" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#E4B8F0" stop-opacity=".28"/>
      <stop offset="1" stop-color="#E4B8F0" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="26"/>
    </filter>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0v40" fill="none" stroke="#ffffff" stroke-opacity=".05" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- 底 -->
  <rect width="1280" height="400" fill="url(#bg)"/>
  <rect width="1280" height="400" fill="url(#grid)"/>
  <ellipse cx="250" cy="90" rx="330" ry="200" fill="url(#glowA)" filter="url(#soft)"/>
  <ellipse cx="1080" cy="330" rx="360" ry="210" fill="url(#glowB)" filter="url(#soft)"/>
  <ellipse cx="960" cy="60" rx="260" ry="150" fill="url(#glowC)" filter="url(#soft)"/>

  <!-- 星屑 -->
  <g fill="#ffffff">
    <circle cx="120" cy="332" r="1.6" opacity=".65"/>
    <circle cx="212" cy="268" r="1.1" opacity=".45"/>
    <circle cx="286" cy="352" r="1.9" opacity=".5"/>
    <circle cx="366" cy="236" r="1.2" opacity=".4"/>
    <circle cx="452" cy="318" r="1.5" opacity=".55"/>
    <circle cx="530" cy="120" r="1.2" opacity=".35"/>
    <circle cx="616" cy="352" r="1.7" opacity=".5"/>
    <circle cx="700" cy="212" r="1.1" opacity=".4"/>
    <circle cx="792" cy="140" r="1.6" opacity=".45"/>
    <circle cx="868" cy="330" r="1.2" opacity=".5"/>
    <circle cx="948" cy="248" r="1.8" opacity=".4"/>
    <circle cx="1032" cy="120" r="1.2" opacity=".5"/>
    <circle cx="1114" cy="286" r="1.5" opacity=".4"/>
    <circle cx="1200" cy="196" r="1.1" opacity=".55"/>
    <circle cx="66" cy="176" r="1.3" opacity=".4"/>
  </g>

  <!-- 左侧标题 -->
  <g font-family="Segoe UI, PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif">
    <text x="80" y="128" font-size="19" letter-spacing="7.5" fill="#9C93D8" font-weight="600">DEEPSEEK HARNESS · PLUGIN PACK</text>
    <text x="78" y="212" font-size="66" font-weight="700" fill="#ffffff" letter-spacing="1">DSH 五件套</text>
    <rect x="80" y="238" width="336" height="4" rx="2" fill="url(#iris)"/>
    <text x="80" y="284" font-size="21" fill="#C9C4EE">生图台 · 余额挂件 · 消费徽章 · 任务通知 · 角色主题</text>
    <text x="80" y="322" font-size="17" fill="#8E88B8">DSH ≥ 0.2.1-rc.2　|　MIT　|　纯 ESM，无需编译原生模块</text>
  </g>

  <!-- 右侧包列表 -->
  <g font-family="Segoe UI, PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif">
    <g transform="translate(700,74)">
      <rect width="500" height="252" rx="20" fill="#000000" opacity=".28"/>
      <rect x="1" y="1" width="498" height="250" rx="19" fill="none" stroke="url(#iris)" stroke-opacity=".45"/>
      <g font-size="16" fill="#EDEBFF">
        <circle cx="26" cy="34" r="4" fill="#86E3F0"/><text x="42" y="40">dsh-image-gen</text>
        <text x="404" y="40" font-size="13" fill="#8E88B8">生图台</text>
        <circle cx="26" cy="78" r="4" fill="#8B7BEE"/><text x="42" y="84">dsh-token-widget</text>
        <text x="404" y="84" font-size="13" fill="#8E88B8">余额</text>
        <circle cx="26" cy="122" r="4" fill="#B9A6F2"/><text x="42" y="128">dsh-session-cost</text>
        <text x="404" y="128" font-size="13" fill="#8E88B8">消费</text>
        <circle cx="26" cy="166" r="4" fill="#E4B8F0"/><text x="42" y="172">dsh-task-notify</text>
        <text x="404" y="172" font-size="13" fill="#8E88B8">通知</text>
        <circle cx="26" cy="210" r="4" fill="#86E3F0"/><text x="42" y="216">dsh-theme-gemini-cat</text>
        <text x="404" y="216" font-size="13" fill="#8E88B8">主题</text>
      </g>
      <g stroke="#ffffff" stroke-opacity=".07">
        <line x1="18" y1="56" x2="482" y2="56"/>
        <line x1="18" y1="100" x2="482" y2="100"/>
        <line x1="18" y1="144" x2="482" y2="144"/>
        <line x1="18" y1="188" x2="482" y2="188"/>
      </g>
    </g>
  </g>

  <!-- 底部虹彩发丝线 -->
  <rect x="0" y="396" width="1280" height="4" fill="url(#iris)" opacity=".85"/>
</svg>
